[package]
name = "cairn"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first shared Markdown documentation in a folder you control"
license = "MIT"
repository = "https://github.com/thekovie/cairn"
readme = "README.md"

[dependencies]
ammonia = "4.2.0"
axum = "0.8.9"
dirs = "7.0.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
mime_guess = "2.0.5"
minisign-verify = "0.3.0"
open = "5.4.4"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
rust-embed = "8.12.0"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
similar = "3.2.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "local-offset", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip", "platform-verifier", "win-system-proxy"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
minisign = "0.10.0"
serial_test = "4.0.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
